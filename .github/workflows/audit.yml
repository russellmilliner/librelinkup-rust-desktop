name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  schedule:
    # New RustSec advisories land independently of commits: re-check weekly (Mon 06:00 UTC).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (${{ matrix.lockfile }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - Cargo.lock        # KDE Plasma app + shared core (workspace root)
          - windows/Cargo.lock # Windows egui app (separate workspace)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Cache cargo-audit binary and advisory DB
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/advisory-db
          key: cargo-audit-${{ runner.os }}-v0.22-${{ github.run_id }}
          restore-keys: cargo-audit-${{ runner.os }}-v0.22-

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked --version ^0.22

      # Fails on vulnerabilities, unsound crates, and yanked crates.
      - name: Audit ${{ matrix.lockfile }}
        run: cargo audit --file "${{ matrix.lockfile }}" --deny unsound --deny yanked
