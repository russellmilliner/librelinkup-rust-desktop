name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Cargo Security Audit (RustSec)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit binary and advisory DB
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/advisory-db
          key: cargo-audit-${{ runner.os }}-v0.22-${{ github.run_id }}
          restore-keys: cargo-audit-${{ runner.os }}-v0.22-

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked --version ^0.22

      - name: Audit workspace Cargo.lock
        run: cargo audit

  linux-test:
    name: Linux KDE Build, Clippy & Headless Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Qt 6 & KDE Frameworks 6 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-svg-dev \
            libkf6colorscheme-dev libkf6config-dev libkf6iconthemes-dev \
            qml6-module-org-kde-kirigami qml6-module-org-kde-desktop qml6-module-org-kde-breeze \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-dialogs qml6-module-qtqml-workerscript \
            breeze-icon-theme fonts-noto-core

      - name: Install Rust (stable, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy (--workspace --all-targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit & headless Qt/QML integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: cargo test --workspace -- --test-threads=1

  build:
    name: Windows Build, Test & Package (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust (stable, MSVC, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            windows -> target
            crates/librelinkup-core -> target

      - name: Clippy shared core & Windows app
        run: |
          cargo clippy --manifest-path crates/librelinkup-core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path windows/Cargo.toml --all-targets -- -D warnings

      - name: Test shared core on Windows
        run: cargo test --release --manifest-path crates/librelinkup-core/Cargo.toml

      - name: Build LibreLinkUp.exe
        run: cargo build --release --manifest-path windows/Cargo.toml

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path windows/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Smoke test (--version, --self-test)
        shell: pwsh
        run: |
          $exe = "windows/target/release/LibreLinkUp.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput version.txt
          Get-Content version.txt
          if ($p.ExitCode -ne 0) { throw "--version failed ($($p.ExitCode))" }
          if (-not (Select-String -Path version.txt -Pattern "${{ steps.version.outputs.version }}")) { throw "version mismatch" }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "--self-test failed ($($p.ExitCode))" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} `
                  /DSourceExe=..\target\release\LibreLinkUp.exe `
                  /DOutputDir=..\dist `
                  windows\installer\LibreLinkUp.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Package portable zip and checksums
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $stage = "windows/dist/portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item windows/target/release/LibreLinkUp.exe $stage/
          Copy-Item windows/README.md "$stage/README.md"
          Copy-Item LICENSE "$stage/LICENSE.txt"
          Copy-Item NOTICE "$stage/NOTICE.txt"
          Compress-Archive -Path "$stage/*" -DestinationPath "windows/dist/LibreLinkUp-$v-windows-x64-portable.zip" -Force
          Get-ChildItem windows/dist -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii -FilePath "$($_.FullName).sha256"
          }
          Get-ChildItem windows/dist -File

      - uses: actions/upload-artifact@v6
        with:
          name: LibreLinkUp-windows-x64
          path: |
            windows/dist/*.exe
            windows/dist/*.zip
            windows/dist/*.sha256

  linux-flatpak:
    name: Build, Sign & Attach Flatpak Bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [security-audit, linux-test]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Flatpak, flatpak-builder and the KDE runtime/SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.kde.Platform//6.11 org.kde.Sdk//6.11 \
            org.freedesktop.Sdk.Extension.rust-stable \
            org.freedesktop.Sdk.Extension.llvm22

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build Flatpak bundle
        run: ./scripts/build-flatpak.sh --no-install

      - name: Report bundle
        run: ls -lh target/release/*.flatpak target/release/*.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: LibreLinkUp-flatpak
          path: |
            target/release/*.flatpak
            target/release/*.sha256

  release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [security-audit, linux-test, build, linux-flatpak]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: LibreLinkUp-windows-x64
          path: windows/dist

      - uses: actions/download-artifact@v7
        with:
          name: LibreLinkUp-flatpak
          path: target/release

      # Authenticity, not just integrity: the in-app updater refuses to execute any artifact
      # without a signature that verifies against the public key compiled into the binary.
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign

      - name: Sign release artifacts (minisign)
        env:
          RELEASE_MINISIGN_KEY: ${{ secrets.RELEASE_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_MINISIGN_KEY:-}" ]; then
            echo "::error::RELEASE_MINISIGN_KEY secret is not configured; refusing to publish unsigned artifacts."
            exit 1
          fi
          KEY="$RUNNER_TEMP/release.key"
          printf '%s\n' "$RELEASE_MINISIGN_KEY" > "$KEY"
          chmod 600 "$KEY"
          shopt -s nullglob
          for f in windows/dist/*.exe windows/dist/*.zip target/release/*.flatpak; do
            minisign -S -s "$KEY" -m "$f" \
              -c "LibreLinkUp Rust Desktop release artifact" \
              -t "artifact:$(basename "$f") run:${GITHUB_RUN_ID}"
          done
          rm -f "$KEY"
          ls -l windows/dist target/release

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            windows/dist/*.exe
            windows/dist/*.zip
            windows/dist/*.sha256
            windows/dist/*.minisig
            target/release/*.flatpak
            target/release/*.flatpak.sha256
            target/release/*.minisig
