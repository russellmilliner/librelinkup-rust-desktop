[package]
name = "librelinkup-kde"
version = "0.5.17"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "LibreLinkUp Rust Desktop — KDE Plasma 6 / Kirigami Blood Glucose Monitor for LibreLinkUp"
repository = "https://github.com/russellmilliner/librelinkup-rust-desktop"

[features]
default = ["ui-tests"]
ui-tests = []

[lib]
name = "librelinkup_kde"
path = "src/lib.rs"

# The shared core is a workspace member so `cargo clippy --workspace` / `cargo test
# --workspace` actually cover it. `windows/` is its own separate workspace (it must not be
# pulled into the Flatpak build) and is therefore not listed here.
[workspace]
members = [".", "crates/librelinkup-core"]

[[bin]]
name = "librelinkup-kde"
path = "src/main.rs"

[dependencies]
# Shared platform-independent core (API client, crypto, models, alerts)
librelinkup-core = { path = "crates/librelinkup-core" }

# Qt 6 / QML Bridge (KDAB CXX-Qt)
cxx = "1.0.130"
cxx-qt = "0.7.2"
cxx-qt-lib = { version = "0.7.2", features = ["qt_gui", "qt_qml"] }

# Async Runtime & Timestamp Serialization
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde_json = "1.0"
chrono = "0.4"

[build-dependencies]
cxx-qt-build = { version = "0.7.2", features = ["link_qt_object_files"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[[test]]
name = "desktop_overlay_widget_tests"
required-features = ["ui-tests"]

[[test]]
name = "task_manager_icon_tests"
required-features = ["ui-tests"]
