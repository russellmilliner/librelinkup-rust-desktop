[package]
name = "librelinkup-kde"
version = "0.4.4"
edition = "2021"
license = "Apache-2.0"
description = "LibreLinkUp Rust Desktop — KDE Plasma 6 / Kirigami Blood Glucose Monitor for LibreLinkUp"
homepage = "https://github.com/russellmilliner/librelinkup-rust-desktop"
repository = "https://github.com/russellmilliner/librelinkup-rust-desktop"

[lib]
name = "librelinkup_kde"
path = "src/lib.rs"

[[bin]]
name = "librelinkup-kde"
path = "src/main.rs"

[dependencies]
# Shared platform-independent core (API client, crypto, models, alerts)
librelinkup-core = { path = "crates/librelinkup-core" }

# Qt 6 / QML Bridge (KDAB CXX-Qt)
cxx = "1.0.130"
cxx-qt = "0.7.2"
cxx-qt-lib = { version = "0.7.2", features = ["qt_gui", "qt_qml"] }

# Async Runtime & HTTP Client
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "blocking"] }

# Authenticated Encryption (AES-256-GCM, PBKDF2-HMAC-SHA256, SHA-256, CSPRNG) & Memory Zeroization
ring = "0.17"
zeroize = "1.8"

# Serialization & Timestamps
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[build-dependencies]
cxx-qt-build = { version = "0.7.2", features = ["link_qt_object_files"] }
