[package]
name = "librelinkup-core"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Platform-independent core of LibreLinkUp Rust Desktop: LibreView API client, encrypted credential envelope, settings, staleness and alert logic"
repository = "https://github.com/russellmilliner/librelinkup-rust-desktop"
publish = false

[lib]
name = "librelinkup_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "blocking"] }
ring = "0.17"
zeroize = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
